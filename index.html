<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>四季彩</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #f7f3ec;
      color: #292622;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Hiragino Kaku Gothic ProN",
        "Yu Gothic",
        sans-serif;
    }

    button {
      font: inherit;
      -webkit-tap-highlight-color: transparent;
    }

    #app {
      min-height: 100vh;
    }

    .app {
      width: min(760px, 100%);
      min-height: 100vh;
      margin: auto;
      padding: 26px 18px 50px;
    }

    /* =========================
       共通
       ========================= */

    .header {
      text-align: center;
      margin-bottom: 28px;
    }

    .title {
      margin: 0;
      font-family: serif;
      font-size: 40px;
      font-weight: 500;
      letter-spacing: .18em;
    }

    .subtitle {
      margin-top: 7px;
      color: #81796e;
      font-size: 13px;
      letter-spacing: .08em;
    }

    .rank-badge {
      display: inline-block;
      margin-top: 14px;
      padding: 6px 16px;
      border-radius: 999px;
      background: #292622;
      color: #fff;
      font-size: 13px;
    }

    .back-button {
      border: 0;
      background: transparent;
      color: #746d64;
      padding: 0;
      cursor: pointer;
      margin-bottom: 18px;
    }

    .screen-header {
      text-align: center;
      margin-bottom: 25px;
    }

    .screen-header h2 {
      margin: 0;
      font-family: serif;
      font-size: 31px;
      font-weight: 500;
    }

    .screen-header p {
      margin: 6px 0 0;
      color: #8b8378;
      font-size: 13px;
    }

    /* =========================
       ホーム
       ========================= */

    .menu {
      display: grid;
      gap: 12px;
    }

    .menu-item {
      width: 100%;
      border: 1px solid #ded7cc;
      border-radius: 20px;
      background: #fff;
      padding: 21px;
      text-align: left;
      cursor: pointer;
      transition: .15s ease;
    }

    .menu-item:hover {
      transform: translateY(-2px);
      box-shadow: 0 7px 20px rgba(0,0,0,.06);
    }

    .menu-title {
      font-family: serif;
      font-size: 25px;
    }

    .menu-reading {
      display: block;
      margin-top: 3px;
      color: #8c8479;
      font-size: 12px;
    }

    .menu-description {
      display: block;
      margin-top: 10px;
      color: #625c54;
      font-size: 14px;
    }

    .dictionary-button {
      width: 100%;
      margin-top: 13px;
      padding: 17px;
      border: 1px solid #ded7cc;
      border-radius: 20px;
      background: transparent;
      cursor: pointer;
    }

    .stats {
      margin-top: 22px;
      padding: 18px;
      border-radius: 20px;
      background: #fff;
      text-align: center;
    }

    .stats-title {
      color: #81796f;
      font-size: 12px;
    }

    .stats-number {
      margin-top: 4px;
      font-family: serif;
      font-size: 28px;
    }

    /* =========================
       入学色
       ========================= */

    .tutorial {
      background: #fff;
      border-radius: 24px;
      padding: 28px;
      line-height: 1.9;
      box-shadow: 0 5px 20px rgba(0,0,0,.045);
    }

    .tutorial h3 {
      margin-top: 0;
      font-family: serif;
      font-size: 22px;
    }

    .tutorial-color {
      width: 150px;
      height: 150px;
      margin: 25px auto;
      border-radius: 50%;
    }

    .primary-button,
    .next-button {
      display: block;
      margin: 25px auto 0;
      padding: 12px 30px;
      border: 0;
      border-radius: 999px;
      background: #292622;
      color: #fff;
      cursor: pointer;
    }

    /* =========================
       クイズ
       ========================= */

    .question-card {
      background: #fff;
      border-radius: 25px;
      padding: 25px;
      text-align: center;
      box-shadow: 0 5px 20px rgba(0,0,0,.045);
    }

    .question-label {
      color: #857d72;
      font-size: 13px;
    }

    /*
      問題の色。
      名前は回答するまで表示しない。
    */
    .question-color {
      width: min(280px, 70vw);
      height: min(280px, 70vw);
      margin: 22px auto 8px;
      border-radius: 28px;
      box-shadow:
        inset 0 0 0 1px rgba(0,0,0,.06),
        0 8px 24px rgba(0,0,0,.08);
    }

    .choices {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
      margin-top: 18px;
    }

    .choice {
      min-height: 120px;
      border: 5px solid #fff;
      border-radius: 20px;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(0,0,0,.12);
      transition: .12s ease;
    }

    .choice:hover:not(:disabled) {
      transform: scale(1.02);
    }

    .choice:disabled {
      cursor: default;
    }

    /*
      回答後の色名一覧
    */

    .answer-list {
      margin-top: 22px;
      display: grid;
      gap: 9px;
    }

    .answer-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 14px;
      border: 1px solid #e2dcd3;
      border-radius: 14px;
      background: #fff;
      text-align: left;
    }

    .answer-item.is-correct {
      border-color: #292622;
      box-shadow: 0 3px 12px rgba(0,0,0,.07);
    }

    .answer-dot {
      flex: 0 0 auto;
      width: 32px;
      height: 32px;
      border-radius: 9px;
    }

    .answer-text {
      min-width: 0;
    }

    .answer-name {
      font-family: serif;
      font-size: 17px;
    }

    .answer-reading {
      margin-top: 2px;
      color: #8b8378;
      font-size: 11px;
    }

    .answer-mark {
      margin-left: auto;
      color: #625c54;
      font-size: 12px;
      white-space: nowrap;
    }

    .result {
      min-height: 30px;
      margin-top: 18px;
      text-align: center;
      font-weight: 700;
    }

    .correct {
      color: #526d4c;
    }

    .wrong {
      color: #9a554d;
    }

    .next-button {
      margin-top: 14px;
    }

       知色
       ========================= */

    .dictionary {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 14px;
    }

      overflow: hidden;
      border-radius: 19px;
      background: white;
      box-shadow: 0 3px 13px rgba(0,0,0,.045);
    }

      padding: 12px 13px 14px;

      font-family: serif;
      font-size: 17px;
    }

      margin-top: 3px;
      color: #8b8378;
      font-size: 11px;
    }

      filter: grayscale(1);
    }

    .unknown .color-info {
      opacity: .55;
    }

        padding-left: 14px;

      }

        width: 220px;
        height: 220px;
      }

      .choice {
        min-height: 100px;
      }

      .dictionary {

    }

/* =====================================================
   共通関数
   ===================================================== */

function shuffle(array) {

  return [...array].sort(
    () => Math.random() - 0.5
  );

}


function colorById(id) {

  return COLORS.find(
    color => color.id === id
  );

}


/* =====================================================
   RGB → Lab
   鑑色用の色差計算
   ===================================================== */

function hexToRgb(hex) {

  return {

    r: parseInt(
      hex.slice(1, 3),
      16
    ),

    g: parseInt(
      hex.slice(3, 5),
      16
    ),

    b: parseInt(
      hex.slice(5, 7),
      16
    )

  };

}


function rgbToLab(rgb) {

  let r = rgb.r / 255;
  let g = rgb.g / 255;
  let b = rgb.b / 255;

  r = r > 0.04045
    ? Math.pow(
        (r + 0.055) / 1.055,
        2.4
      )
    : r / 12.92;

  g = g > 0.04045
    ? Math.pow(
        (g + 0.055) / 1.055,
        2.4
      )
    : g / 12.92;

  b = b > 0.04045
    ? Math.pow(
        (b + 0.055) / 1.055,
        2.4
      )
    : b / 12.92;


  const x =
    (r * 0.4124 +
     g * 0.3576 +
     b * 0.1805) / 0.95047;

  const y =
    (r * 0.2126 +
     g * 0.7152 +
     b * 0.0722);

  const z =
    (r * 0.0193 +
     g * 0.1192 +
     b * 0.9505) / 1.08883;


  function f(value) {

    return value > 0.008856
      ? Math.pow(value, 1 / 3)
      : 7.787 * value + 16 / 116;

  }


  return {

    L: 116 * f(y) - 16,

    a:
      500 *
      (f(x) - f(y)),

    b:
      200 *
      (f(y) - f(z))

  };

}


function colorDistance(a, b) {

  const labA =
    rgbToLab(
      hexToRgb(a.hex)
    );

  const labB =
    rgbToLab(
      hexToRgb(b.hex)
    );


  return Math.sqrt(

    Math.pow(
      labA.L - labB.L,
      2
    ) +

    Math.pow(
      labA.a - labB.a,
      2
    ) +

    Math.pow(
      labA.b - labB.b,
      2
    )

  );

}


/* =====================================================
   色別
   ===================================================== */

function createShikibetsuQuestion() {

  const target =
    COLORS[
      Math.floor(
        Math.random() *
        COLORS.length
      )
    ];


  const otherFamilies =
    [
      ...new Set(

        COLORS
          .map(
            color =>
              color.family
          )

          .filter(
            family =>
              family !==
              target.family
          )

      )
    ];


  const families =
    shuffle(
      otherFamilies
    ).slice(0, 3);


  const wrongChoices =
    families.map(
      family => {

        const candidates =
          COLORS.filter(
            color =>
              color.family ===
              family
          );

        return candidates[
          Math.floor(
            Math.random() *
            candidates.length
          )
        ];

      }
    );


  state.question = target;

  state.choices =
    shuffle([
      target,
      ...wrongChoices
    ]);

}


/* =====================================================
   鑑色
   ===================================================== */

function createKanshikiQuestion() {

  const groups = {};


  COLORS.forEach(
    color => {

      if (!groups[color.family]) {
        groups[color.family] = [];
      }

      groups[color.family].push(
        color
      );

    }
  );


  const validFamilies =
    Object.keys(groups)
      .filter(
        family =>
          groups[family].length >= 4
      );


  let targetFamily;


  if (validFamilies.length > 0) {

    targetFamily =
      validFamilies[
        Math.floor(
          Math.random() *
          validFamilies.length
        )
      ];

  } else {

    targetFamily =
      COLORS[0].family;

  }


  const familyColors =
    groups[targetFamily];


  const target =
    familyColors[
      Math.floor(
        Math.random() *
        familyColors.length
      )
    ];


  const candidates =
    familyColors

      .filter(
        color =>
          color.id !== target.id
      )

      .map(
        color => ({

          color,

          distance:
            colorDistance(
              target,
              color
            )

        })
      )

      .sort(
        (a, b) =>
          a.distance -
          b.distance
      );


  const wrongChoices =
    candidates
      .slice(
        0,
        3
      )
      .map(
        item =>
          item.color
      );


  state.question = target;

  state.choices =
    shuffle([
      target,
      ...wrongChoices
    ]);

}


/* =====================================================
   ランク
   ===================================================== */

function currentRank() {

  let rank =
    RANKS[0];


  for (
    const candidate of RANKS
  ) {

    if (
      state.correctAnswers >=
      candidate.required
    ) {

      rank = candidate;

    }

  }


  return rank;

}

    "shikisai_discovered",
    JSON.stringify(

}

            </span>

            <span class="menu-reading">
              かんしき
            </span>

            <span class="menu-description">
              同系色の違いを見極める
            </span>

          </button>


        </section>


        <button
          class="dictionary-button"
          onclick="openDictionary()">

          知色（ちしき）
          　色図鑑

        </button>


        <section class="stats">

          <div class="stats-title">
            正解数
          </div>

          <div class="stats-number">
            ${state.correctAnswers}
          </div>

        </section>

      </main>

    `;

}


/* =====================================================
   入学色
   ===================================================== */

function openTutorial() {

  state.screen =
    "tutorial";


  document.getElementById("app")
    .innerHTML = `

      <main class="app">

        <button
          class="back-button"
          onclick="goHome()">

          ← 戻る

        </button>


        <div class="screen-header">

          <h2>
            入学色
          </h2>

          <p>
            にゅうがくしき
          </p>

        </div>


        <section class="tutorial">

          <h3>
            四季彩へようこそ。
          </h3>

          <p>
            四季彩では、
            日本のさまざまな色を見て、
            その色を識っていきます。
          </p>


          <div
            class="tutorial-color"
            style="
              background:#F8B400;
            ">
          </div>


          <p style="text-align:center">

            <strong>
              山吹色
            </strong>

          </p>


          <p>
            <strong>色別</strong>では、
            系統の違う色を見比べます。
          </p>


          <p>
            <strong>鑑色</strong>では、
            同系色の中から
            微妙な違いを見極めます。
          </p>


          <p>
            正解した色は
            <strong>知色</strong>に記録されます。
          </p>


          <button
            class="primary-button"
            onclick="goHome()">

            はじめる

          </button>

        </section>

      </main>

}


/* =====================================================
   モード開始
   ===================================================== */

function startMode(mode) {

  state.mode =
    mode;


  if (
    mode ===
    "shikibetsu"
  ) {

    createShikibetsuQuestion();

  } else {

    createKanshikiQuestion();

  }


  state.answered =
    false;

  state.correct =
    false;

  state.selectedId =
    null;

  state.screen =
    "quiz";


  renderQuiz();

}


/* =====================================================
   クイズ画面
   ===================================================== */

function renderQuiz() {

  const isShikibetsu =
    state.mode === "shikibetsu";

  const modeName =
    isShikibetsu
      ? "色別"
      : "鑑色";

  const modeDescription =
    isShikibetsu
      ? "系統の違う色から選ぶ"
      : "同系色の中から見極める";


  document.getElementById("app")
    .innerHTML = `

      <main class="app">

        <button
          class="back-button"
          onclick="goHome()">

          ← 戻る

        </button>


        <div class="screen-header">

          <h2>
            ${modeName}
          </h2>

          <p>
            ${modeDescription}
          </p>

        </div>


        <section class="question-card">

          <div class="question-label">
            この色は何色？
          </div>

          <div class="question-name">
            ${state.question.name}
          </div>

        </section>


        <section class="choices">

          ${state.choices.map(
            color => {

              let choiceClass = "choice";


              /*
                回答後は、
                正解カードを強調する。
              */

              if (
                state.answered &&
                color.id === state.question.id
              ) {

                choiceClass +=
                  " correct-choice";

              }


              /*
                選択した不正解カードは
                少し薄くする。
              */

              if (
                state.answered &&
                color.id === state.selectedId &&
                color.id !== state.question.id
              ) {

                choiceClass +=
                  " wrong-choice";

              }


              return `

                <div class="choice-wrapper">

                  <button
                    class="${choiceClass}"
                    style="
                      background:${color.hex};
                    "
                    ${
                      state.answered
                        ? "disabled"
                        : ""
                    }
                    onclick="
                      answer('${color.id}')
                    "
                    aria-label="
                      色を選択
                    ">

                  </button>


                  ${
                    state.answered
                      ? `

                        <div class="choice-name">

                          <div
                            class="choice-name-main">

                            ${color.name}

                          </div>

                          <div
                            class="choice-name-reading">

                            ${color.reading}

                          </div>

                        </div>

                      `
                      : ""
                  }

                </div>

              `;

            }
          ).join("")}

        </section>


        <div
          class="
            result
            ${
              state.answered
                ? state.correct
                  ? "correct"
                  : "wrong"
                : ""
            }
          ">

          ${
            state.answered
              ? state.correct
                ? "正解"
                : "不正解"
              : ""
          }

        </div>


        ${
          state.answered
            ? `

              <button
                class="next-button"
                onclick="nextQuestion()">

                次の問題

              </button>

            `
            : ""
        }

      </main>

    `;

}

/* =====================================================
   回答後の4色一覧
   ===================================================== */

function renderAnswerDetails() {

  return `

    <section class="answer-list">

      ${state.choices.map(
        color => {

          const isCorrect =
            color.id ===
            state.question.id;


          return `

            <div
              class="
                answer-item
                ${
                  isCorrect
                    ? "is-correct"
                    : ""
                }
              ">

              <div
                class="answer-dot"
                style="
                  background:${color.hex};
                ">
              </div>


              <div class="answer-text">

                <div class="answer-name">

                  ${color.name}

                </div>

                <div class="answer-reading">

                  ${color.reading}

                </div>

              </div>


              ${
                isCorrect
                  ? `

                    <div
                      class="answer-mark">

                      正解

                    </div>

                  `
                  : ""
              }

            </div>

          `;

        }
      ).join("")}

    </section>

  `;

}


/* =====================================================
   回答
   ===================================================== */

function answer(id) {

  if (
    state.answered
  ) {

    return;

  }


  const selected =
    colorById(id);


  if (!selected) {
    return;
  }


  state.selectedId =
    id;


  state.answered =
    true;


  state.correct =
    selected.id ===
    state.question.id;


  if (
    state.correct
  ) {

    state.correctAnswers++;


    /*
      知色には
      色そのもののIDを保存する。
    */

    state.discovered.add(
      state.question.id
    );


    saveProgress();

  }


  renderQuiz();

}


/* =====================================================
   次の問題
   ===================================================== */

function nextQuestion() {

  if (
    state.mode ===
    "shikibetsu"
  ) {

    createShikibetsuQuestion();

  } else {

    createKanshikiQuestion();

  }


  state.answered =
    false;

  state.correct =
    false;

  state.selectedId =
    null;


  renderQuiz();

}


/* =====================================================
   知色
   ===================================================== */

function openDictionary() {

  state.screen =
    "dictionary";


  renderDictionary();

}


function renderDictionary() {

  document.getElementById("app")
    .innerHTML = `

      <main class="app">

        <button
          class="back-button"
          onclick="goHome()">

          ← 戻る

        </button>


        <div class="screen-header">

          <h2>
            知色
          </h2>

          <p>
            ちしき　— 色図鑑 —
          </p>

        </div>


        <section class="dictionary">

          ${COLORS.map(
            color => {

              const known =
                state.discovered.has(
                  color.id
                );


              return `

                <article
                  class="
                    color-card
                    ${
                      known
                        ? ""
                        : "unknown"
                    }
                  ">

                  <div
                    class="color-sample"
                    style="
                      background:
                        ${color.hex};
                    ">
                  </div>


                  <div class="color-info">

                    <div class="color-name">

                      ${
                        known
                          ? color.name
                          : "？？？"
                      }

                    </div>


                    <div class="color-reading">

                      ${
                        known
                          ? color.reading
                          : "未発見"
                      }

                    </div>

                  </div>

                </article>

              `;

            }
          ).join("")}

        </section>


        <section class="stats">

          <div class="stats-title">
            発見した色
          </div>


          <div class="stats-number">

            ${
              state.discovered.size
            }

            /

            ${COLORS.length}

          </div>

        </section>

      </main>

    `;

}


/* =====================================================
   ホームへ
   ===================================================== */

function goHome() {

  state.screen =
    "home";


  renderHome();

}


/* =====================================================
   起動
   ===================================================== */

renderHome();

</script>
