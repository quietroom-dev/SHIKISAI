<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>四季彩</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #f7f3ec;
      color: #292622;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Hiragino Kaku Gothic ProN",
        "Yu Gothic",
        sans-serif;
    }

    button {
      font: inherit;
      -webkit-tap-highlight-color: transparent;
    }

    #app {
      min-height: 100vh;
    }

    .app {
      width: min(760px, 100%);
      min-height: 100vh;
      margin: auto;
      padding: 26px 18px 50px;
    }

    /* =========================
       共通
       ========================= */

    .header {
      text-align: center;
      margin-bottom: 28px;
    }

    .title {
      margin: 0;
      font-family: serif;
      font-size: 40px;
      font-weight: 500;
      letter-spacing: .18em;
    }

    .subtitle {
      margin-top: 7px;
      color: #81796e;
      font-size: 13px;
      letter-spacing: .08em;
    }

    .rank-badge {
      display: inline-block;
      margin-top: 14px;
      padding: 6px 16px;
      border-radius: 999px;
      background: #292622;
      color: #fff;
      font-size: 13px;
    }

    .back-button {
      border: 0;
      background: transparent;
      color: #746d64;
      padding: 0;
      cursor: pointer;
      margin-bottom: 18px;
    }

    .screen-header {
      text-align: center;
      margin-bottom: 25px;
    }

    .screen-header h2 {
      margin: 0;
      font-family: serif;
      font-size: 31px;
      font-weight: 500;
    }

    .screen-header p {
      margin: 6px 0 0;
      color: #8b8378;
      font-size: 13px;
    }

    /* =========================
       ホーム
       ========================= */

    .menu {
      display: grid;
      gap: 12px;
    }

    .menu-item {
      width: 100%;
      border: 1px solid #ded7cc;
      border-radius: 20px;
      background: #fff;
      padding: 21px;
      text-align: left;
      cursor: pointer;
      transition: .15s ease;
    }

    .menu-item:hover {
      transform: translateY(-2px);
      box-shadow: 0 7px 20px rgba(0,0,0,.06);
    }

    .menu-title {
      font-family: serif;
      font-size: 25px;
    }

    .menu-reading {
      display: block;
      margin-top: 3px;
      color: #8c8479;
      font-size: 12px;
    }

    .menu-description {
      display: block;
      margin-top: 10px;
      color: #625c54;
      font-size: 14px;
    }

    .stats {
      margin-top: 22px;
      padding: 18px;
      border-radius: 20px;
      background: #fff;
      text-align: center;
    }

    .stats-title {
      color: #81796f;
      font-size: 12px;
    }

    .stats-number {
      margin-top: 4px;
      font-family: serif;
      font-size: 28px;
    }

    /* =========================
       入学色
       ========================= */

    .tutorial {
      background: #fff;
      border-radius: 24px;
      padding: 28px;
      line-height: 1.9;
      box-shadow: 0 5px 20px rgba(0,0,0,.045);
    }

    .tutorial h3 {
      margin-top: 0;
      font-family: serif;
      font-size: 22px;
    }

    .tutorial-color {
      width: 150px;
      height: 150px;
      margin: 25px auto;
      border-radius: 50%;
    }

    .primary-button,
    .next-button {
      display: block;
      margin: 25px auto 0;
      padding: 12px 30px;
      border: 0;
      border-radius: 999px;
      background: #292622;
      color: #fff;
      cursor: pointer;
    }

    /* =========================
       クイズ
       ========================= */

    .question-card {
      background: #fff;
      border-radius: 25px;
      padding: 25px;
      text-align: center;
      box-shadow: 0 5px 20px rgba(0,0,0,.045);
    }

    .question-label {
      color: #857d72;
      font-size: 13px;
    }

    /*
      問題の色。
      名前は回答するまで表示しない。
    */
    .question-color {
      width: min(280px, 70vw);
      height: min(280px, 70vw);
      margin: 22px auto 8px;
      border-radius: 28px;
      box-shadow:
        inset 0 0 0 1px rgba(0,0,0,.06),
        0 8px 24px rgba(0,0,0,.08);
    }

    .choices {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
      margin-top: 18px;
    }

    .choice {
      min-height: 120px;
      border: 5px solid #fff;
      border-radius: 20px;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(0,0,0,.12);
      transition: .12s ease;
    }

    .choice:hover:not(:disabled) {
      transform: scale(1.02);
    }

    .choice:disabled {
      cursor: default;
    }

    /*
      回答後の色名一覧
    */

    .answer-list {
      margin-top: 22px;
      display: grid;
      gap: 9px;
    }

    .answer-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 14px;
      border: 1px solid #e2dcd3;
      border-radius: 14px;
      background: #fff;
      text-align: left;
    }

    .answer-item.is-correct {
      border-color: #292622;
      box-shadow: 0 3px 12px rgba(0,0,0,.07);
    }

    .answer-dot {
      flex: 0 0 auto;
      width: 32px;
      height: 32px;
      border-radius: 9px;
    }

    .answer-text {
      min-width: 0;
    }

    .answer-name {
      font-family: serif;
      font-size: 17px;
    }

    .answer-reading {
      margin-top: 2px;
      color: #8b8378;
      font-size: 11px;
    }

    .answer-mark {
      margin-left: auto;
      color: #625c54;
      font-size: 12px;
      white-space: nowrap;
    }

    .result {
      min-height: 30px;
      margin-top: 18px;
      text-align: center;
      font-weight: 700;
    }

    .correct {
      color: #526d4c;
    }

    .wrong {
      color: #9a554d;
    }

    .next-button {
      margin-top: 14px;
    }

    /* =========================
       知色
       ========================= */

    .dictionary {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 14px;
    }

    .color-card {
      overflow: hidden;
      border-radius: 19px;
      background: white;
      box-shadow: 0 3px 13px rgba(0,0,0,.045);
    }

    .color-sample {
      height: 125px;
    }

    .color-info {
      padding: 12px 13px 14px;
    }

    .color-name {
      font-family: serif;
      font-size: 17px;
    }

    .color-reading {
      margin-top: 3px;
      color: #8b8378;
      font-size: 11px;
    }

    .unknown .color-sample {
      filter: grayscale(1);
    }

    .unknown .color-info {
      opacity: .55;
    }

    @media (max-width: 480px) {

      .app {
        padding-left: 14px;
        padding-right: 14px;
      }

      .title {
        font-size: 35px;
      }

      .question-color {
        width: 220px;
        height: 220px;
      }

      .choice {
        min-height: 100px;
      }

      .dictionary {
        gap: 10px;
      }
    }

    /* ---------- 回答後の色名 ---------- */

.choice-wrapper {
  display: flex;
  flex-direction: column;
}

.choice-name {
  min-height: 43px;
  padding: 7px 4px 0;
  text-align: center;
}

.choice-name-main {
  font-family: serif;
  font-size: 16px;
}

.choice-name-reading {
  margin-top: 2px;
  color: #8b8378;
  font-size: 10px;
}

.choice.correct-choice {
  box-shadow:
    0 0 0 3px #526d4c,
    0 4px 14px rgba(0,0,0,.12);
}

.choice.wrong-choice {
  opacity: .65;
}

/* ---------- 称号 ---------- */

.rank-section {
  margin-top: 14px;
  text-align: center;
}

.rank-label {
  color: #81796e;
  font-size: 11px;
  letter-spacing: .08em;
}

.rank-badge {
  all: unset;
  display: inline-flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;

  margin-top: 14px;
  padding: 13px 28px;

  border: 1px solid #ded7cc;
  border-radius: 18px;

  background: #fff;
  color: #292622;

  cursor: pointer;

  box-shadow: 0 3px 13px rgba(0,0,0,.045);
  transition: .15s ease;
}

.rank-badge:hover {
  transform: translateY(-2px);
  box-shadow: 0 7px 20px rgba(0,0,0,.06);
}

.rank-name {
  font-family: serif;
  font-size: 24px;
  line-height: 1.2;
}

.rank-reading {
  margin-top: 1px;
  color: #8c8479;
  font-size: 11px;
}

.rank-next {
  margin-top: 7px;
  color: #81796e;
  font-size: 10px;
  letter-spacing: .04em;
}

.rank-hint {
  margin-top: 5px;
  color: #aaa298;
  font-size: 10px;
}

.rank-list {
  display: grid;
  gap: 10px;
  margin-top: 20px;
}

.rank-item {
  display: flex;
  align-items: center;
  padding: 15px 17px;
  border: 1px solid #ded7cc;
  border-radius: 16px;
  background: #fff;
}

.rank-item.current {
  border-color: #292622;
  box-shadow: 0 4px 14px rgba(0,0,0,.06);
}

.rank-item.locked {
  opacity: .45;
}

.rank-item-name {
  font-family: serif;
  font-size: 19px;
}

.rank-item-reading {
  margin-left: 8px;
  color: #8c8479;
  font-size: 11px;
}

.rank-item-required {
  margin-left: auto;
  color: #81796e;
  font-size: 11px;
}

.rank-current {
  margin-left: 8px;
  font-size: 10px;
}

.rank-item-description {
  margin-top: 7px;
  color: #625c54;
  font-size: 12px;
  line-height: 1.6;
}
/* ---------- footer advertisement ---------- */

.footer-ad {
  position: fixed;
  left: 0;
  right: 0;
  bottom: 0;
  z-index: 1000;

  display: flex;
  justify-content: center;
  align-items: center;

  min-height: 62px;
  padding: 8px 14px;

  background: rgba(255, 255, 255, .96);
  border-top: 1px solid #ded7cc;
  box-shadow: 0 -4px 16px rgba(0,0,0,.06);
}

.footer-ad a {
  display: flex;
  align-items: center;
  gap: 14px;

  width: min(700px, 100%);
  min-height: 46px;

  padding: 8px 16px;

  border-radius: 14px;

  background: #292622;
  color: #fff;

  text-decoration: none;
}

.footer-ad-label {
  flex: 0 0 auto;

  padding: 5px 9px;
  border: 1px solid rgba(255,255,255,.35);
  border-radius: 7px;

  font-size: 10px;
  line-height: 1.2;
  letter-spacing: .06em;
  opacity: .8;
}

.footer-ad-title {
  flex: 0 0 auto;

  font-family: serif;
  font-size: 17px;
  line-height: 1.2;
  white-space: nowrap;
}

.footer-ad-text {
  flex: 1 1 auto;

  min-width: 0;

  font-size: 14px;
  line-height: 1.4;
  opacity: .8;
}

.footer-ad-arrow {
  flex: 0 0 auto;

  margin-left: 0;

  font-size: 20px;
  opacity: .7;
}

/* 広告に隠れないようにする */
.app {
  padding-bottom: 110px;
}

.footer-ad-label {
  padding: 4px 8px;
  border: 1px solid rgba(255,255,255,.35);
  border-radius: 6px;
  font-size: 10px;
  letter-spacing: .08em;
  opacity: .8;
}

@media (max-width: 480px) {

.footer-ad {
  min-height: 58px;
  padding: 7px 10px;
}

.footer-ad a {
  gap: 9px;
  padding: 7px 11px;
}

.footer-ad-label {
  padding: 5px 7px;
  font-size: 9px;
  white-space: nowrap;
}

.footer-ad-title {
  font-size: 15px;
  white-space: nowrap;
}

.footer-ad-text {
  font-size: 12px;
  line-height: 1.3;
}

.footer-ad-arrow {
  font-size: 18px;
}

}

/* ---------- 友達に紹介 ---------- */

.share-button {
  position: absolute;
  top: 18px;
  right: 18px;

  display: inline-flex;
  align-items: center;
  gap: 6px;

  padding: 7px 11px;

  border: 1px solid #ded7cc;
  border-radius: 999px;

  background: transparent;
  color: #746d64;

  font-size: 11px;
  letter-spacing: .03em;

  cursor: pointer;
}

.share-button:hover {
  background: #fff;
}

.share-icon {
  font-size: 14px;
}

@media (max-width: 480px) {

  .share-button {
    top: 12px;
    right: 12px;
    padding: 6px 9px;
    font-size: 10px;
  }

}

/* =====================================================
   背景設定
   ===================================================== */

.background-screen {
  display: flex;
  flex-direction: column;
  min-height: 100vh;
}


/* ---------- プレビュー ---------- */

.background-preview {
  flex: 0 0 auto;
  margin-bottom: 14px;
}

.background-preview-inner {
  height: 145px;

  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;

  border: 1px solid #ded7cc;
  border-radius: 22px;

  box-shadow:
    0 4px 16px rgba(0,0,0,.05);

  overflow: hidden;
}

.background-preview-title {
  font-family: serif;
  font-size: 29px;
  letter-spacing: .14em;
}

.background-preview-subtitle {
  margin-top: 5px;
  color: #625c54;
  font-size: 11px;
}


/* ---------- スタイル ---------- */

.background-styles {
  flex: 0 0 auto;

  display: grid;
  grid-template-columns:
    repeat(4, 1fr);

  gap: 7px;
}

.background-style-button {
  min-height: 42px;

  padding: 6px 4px;

  border: 1px solid #ded7cc;
  border-radius: 12px;

  background: #fff;
  color: #625c54;

  font-size: 11px;

  cursor: pointer;

  transition: .15s ease;
}

.background-style-button.selected {
  border-color: #292622;
  color: #292622;

  box-shadow:
    0 3px 10px rgba(0,0,0,.06);
}


/* ---------- 説明 ---------- */

.background-instruction {
  flex: 0 0 auto;

  margin-top: 13px;

  text-align: center;

  color: #81796e;
  font-size: 11px;
}

.background-selected {
  flex: 0 0 auto;

  display: flex;
  justify-content: center;
  gap: 18px;

  margin-top: 7px;

  color: #625c54;
  font-size: 11px;
}


/* ---------- 色一覧 ---------- */

.background-colors {
  flex: 1 1 auto;

  min-height: 0;

  display: grid;
  grid-template-columns:
    repeat(6, 1fr);

  gap: 10px;

  margin-top: 14px;

  padding: 4px 2px 20px;

  overflow-y: auto;

  align-content: start;
}

.background-color {
  position: relative;

  width: 100%;
  aspect-ratio: 1;

  border: 2px solid transparent;
  border-radius: 50%;

  cursor: pointer;

  box-shadow:
    0 2px 8px rgba(0,0,0,.10);

  transition: .15s ease;
}

.background-color.selected {
  border-color: #292622;

  box-shadow:
    0 0 0 2px #fff,
    0 0 0 4px #292622;
}

.background-color span {
  position: absolute;

  right: -3px;
  bottom: -3px;

  width: 18px;
  height: 18px;

  display: flex;
  align-items: center;
  justify-content: center;

  border-radius: 50%;

  background: #292622;
  color: #fff;

  font-size: 10px;
}

.background-empty {
  grid-column: 1 / -1;

  padding: 30px 10px;

  text-align: center;

  color: #8b8378;
  font-size: 12px;
}


/* ---------- スマホ ---------- */

@media (max-width: 480px) {

  .background-preview-inner {
    height: 125px;
  }

  .background-preview-title {
    font-size: 25px;
  }

  .background-styles {
    gap: 5px;
  }

  .background-style-button {
    min-height: 40px;
    font-size: 10px;
  }

  .background-colors {
    grid-template-columns:
      repeat(5, 1fr);

    gap: 9px;
  }

}
.background-menu-button {
  display: block;
  width: 100%;

  margin: 14px 0 0;
  padding: 13px 16px;

  border: 1px solid #ded7cc;
  border-radius: 16px;

  background: #fff;
  color: #625c54;

  font-size: 13px;
  text-align: center;

  cursor: pointer;

  transition: .15s ease;
}

.background-menu-button:hover {
  transform: translateY(-1px);
  box-shadow: 0 5px 14px rgba(0,0,0,.05);
  color: #292622;
}

  </style>
</head>

/* =====================================================
   共通関数
   ===================================================== */

function shuffle(array) {

  return [...array].sort(
    () => Math.random() - 0.5
  );

}

function randomTargetColor() {

  const undiscovered =
  COLORS.filter(
    color =>
      !state.discovered.has(color.id)
  );

  // 未登録色があれば80%の確率で未登録色を出す
  if (
    undiscovered.length > 0 &&
    Math.random() < 0.8
  ) {

    return undiscovered[
      Math.floor(
        Math.random() *
        undiscovered.length
      )
    ];

  }

  // 残り20%は全色から出す
  return COLORS[
    Math.floor(
      Math.random() *
      COLORS.length
    )
  ];

}

function colorById(id) {

  return COLORS.find(
    color => color.id === id
  );

}


/* =====================================================
   RGB → Lab
   鑑色用の色差計算
   ===================================================== */

function hexToRgb(hex) {

  return {

    r: parseInt(
      hex.slice(1, 3),
      16
    ),

    g: parseInt(
      hex.slice(3, 5),
      16
    ),

    b: parseInt(
      hex.slice(5, 7),
      16
    )

  };

}


function rgbToLab(rgb) {

  let r = rgb.r / 255;
  let g = rgb.g / 255;
  let b = rgb.b / 255;

  r = r > 0.04045
    ? Math.pow(
        (r + 0.055) / 1.055,
        2.4
      )
    : r / 12.92;

  g = g > 0.04045
    ? Math.pow(
        (g + 0.055) / 1.055,
        2.4
      )
    : g / 12.92;

  b = b > 0.04045
    ? Math.pow(
        (b + 0.055) / 1.055,
        2.4
      )
    : b / 12.92;


  const x =
    (r * 0.4124 +
     g * 0.3576 +
     b * 0.1805) / 0.95047;

  const y =
    (r * 0.2126 +
     g * 0.7152 +
     b * 0.0722);

  const z =
    (r * 0.0193 +
     g * 0.1192 +
     b * 0.9505) / 1.08883;


  function f(value) {

    return value > 0.008856
      ? Math.pow(value, 1 / 3)
      : 7.787 * value + 16 / 116;

  }


  return {

    L: 116 * f(y) - 16,

    a:
      500 *
      (f(x) - f(y)),

    b:
      200 *
      (f(y) - f(z))

  };

}


function colorDistance(a, b) {

  const labA =
    rgbToLab(
      hexToRgb(a.hex)
    );

  const labB =
    rgbToLab(
      hexToRgb(b.hex)
    );


  return Math.sqrt(

    Math.pow(
      labA.L - labB.L,
      2
    ) +

    Math.pow(
      labA.a - labB.a,
      2
    ) +

    Math.pow(
      labA.b - labB.b,
      2
    )

  );

}


/* =====================================================
   色別
   ===================================================== */

function createShikibetsuQuestion() {

  const target = randomTargetColor();

  const otherFamilies =
    [
      ...new Set(

        COLORS
          .map(
            color =>
              color.family
          )

          .filter(
            family =>
              family !==
              target.family
          )

      )
    ];


  const families =
    shuffle(
      otherFamilies
    ).slice(0, 3);


  const wrongChoices =
    families.map(
      family => {

        const candidates =
          COLORS.filter(
            color =>
              color.family ===
              family
          );

        return candidates[
          Math.floor(
            Math.random() *
            candidates.length
          )
        ];

      }
    );


  state.question = target;

  state.choices =
    shuffle([
      target,
      ...wrongChoices
    ]);

}


/* =====================================================
   鑑色
   ===================================================== */

function createKanshikiQuestion() {

  const groups = {};


  COLORS.forEach(
    color => {

      if (!groups[color.family]) {
        groups[color.family] = [];
      }

      groups[color.family].push(
        color
      );

    }
  );


  // 4色以上ある系統だけを対象にする
  const validFamilies =
    Object.keys(groups)
      .filter(
        family =>
          groups[family].length >= 4
      );


  if (
    validFamilies.length === 0
  ) {

    return;

  }


  // まず系統を決める
  const targetFamily =
    validFamilies[
      Math.floor(
        Math.random() *
        validFamilies.length
      )
    ];


  // その系統の色だけから正解を選ぶ
  const familyColors =
    groups[targetFamily];


  const undiscovered =
    familyColors.filter(
      color =>
        !state.discovered.has(color.id)
    );


  let target;


  // 未発見色があれば80%の確率で優先
  if (
    undiscovered.length > 0 &&
    Math.random() < 0.8
  ) {

    target =
      undiscovered[
        Math.floor(
          Math.random() *
          undiscovered.length
        )
      ];

  } else {

    target =
      familyColors[
        Math.floor(
          Math.random() *
          familyColors.length
        )
      ];

  }


  // 正解と同じ系統の色だけから選択肢を作る
  const candidates =
    familyColors

      .filter(
        color =>
          color.id !== target.id
      )

      .map(
        color => ({

          color,

          distance:
            colorDistance(
              target,
              color
            )

        })
      )

      .sort(
        (a, b) =>
          a.distance -
          b.distance
      );


  const wrongChoices =
    candidates
      .slice(0, 3)
      .map(
        item =>
          item.color
      );


  state.question =
    target;


  state.choices =
    shuffle([
      target,
      ...wrongChoices
    ]);

}

function currentRank() {

  let rank = RANKS[0];

  const discoveredCount =
    state.discovered.size;

  for (const candidate of RANKS) {

    if (
      discoveredCount >=
      candidate.required
    ) {
      rank = candidate;
    }

  }

  return rank;

}

/* =====================================================
   背景
   ===================================================== */

function getBackgroundStyle() {

  const color1 =
    colorById(state.backgroundColor1);

  const color2 =
    colorById(state.backgroundColor2);


  if (
    state.backgroundStyle === "solid" &&
    color1
  ) {

    return color1.hex;

  }


  if (
    state.backgroundStyle === "gradient-white" &&
    color1
  ) {

    return `linear-gradient(
      135deg,
      ${color1.hex},
      #ffffff
    )`;

  }


  if (
    state.backgroundStyle === "gradient-two" &&
    color1 &&
    color2
  ) {

    return `linear-gradient(
      135deg,
      ${color1.hex},
      ${color2.hex}
    )`;

  }


  return "#f7f3ec";

}


function applyBackground() {

  document.body.style.background =
    getBackgroundStyle();

}


function saveBackground() {

  localStorage.setItem(
    "shikisai_background_style",
    state.backgroundStyle

    state.backgroundColor1 || ""
  );

  localStorage.setItem(
    "shikisai_background_color2",
    state.backgroundColor2 || ""
  );

}

    "quiz";


  renderQuiz();

}


/* =====================================================
   クイズ画面
   ===================================================== */

function renderQuiz() {

  const isShikibetsu =
    state.mode === "shikibetsu";

  const modeName =
    isShikibetsu
      ? "色別"
      : "鑑色";

  const modeDescription =
    isShikibetsu
      ? "色を名称で識別する。"
      : "繊細な色の違いを鑑識する。";


  document.getElementById("app")
    .innerHTML = `

      <main class="app">

        <button
          class="back-button"
          onclick="goHome()">

          ← 戻る

        </button>


        <div class="screen-header">

          <h2>
            ${modeName}
          </h2>

          <p>
            ${modeDescription}
          </p>

        </div>


        <section class="question-card">

          <div class="question-label">
            この色は何色？
          </div>

          <div class="question-name">
            ${state.question.name}
          </div>

        </section>


        <section class="choices">

          ${state.choices.map(
            color => {

              let choiceClass = "choice";


              /*
                回答後は、
                正解カードを強調する。
              */

              if (
                state.answered &&
                color.id === state.question.id
              ) {

                choiceClass +=
                  " correct-choice";

              }


              /*
                選択した不正解カードは
                少し薄くする。
              */

              if (
                state.answered &&
                color.id === state.selectedId &&
                color.id !== state.question.id
              ) {

                choiceClass +=
                  " wrong-choice";

              }


              return `

                <div class="choice-wrapper">

                  <button
                    class="${choiceClass}"
                    style="
                      background:${color.hex};
                    "
                    ${
                      state.answered
                        ? "disabled"
                        : ""
                    }
                    onclick="
                      answer('${color.id}')
                    "
                    aria-label="
                      色を選択
                    ">

                  </button>


                  ${
                    state.answered
                      ? `

                        <div class="choice-name">

                          <div
                            class="choice-name-main">

                            ${color.name}

                          </div>

                          <div
                            class="choice-name-reading">

                            ${color.reading}

                          </div>

                        </div>

                      `
                      : ""
                  }

                </div>

              `;

            }
          ).join("")}

        </section>


        <div
          class="
            result
            ${
              state.answered
                ? state.correct
                  ? "correct"
                  : "wrong"
                : ""
            }
          ">

          ${
            state.answered
              ? state.correct
                ? "正解"
                : "不正解"
              : ""
          }

        </div>


        ${
          state.answered
            ? `

              <button
                class="next-button"
                onclick="nextQuestion()">

                次の問題

              </button>

            `
            : ""
        }

      </main>

    `;

}

/* =====================================================
   回答後の4色一覧
   ===================================================== */

function renderAnswerDetails() {

  return `

    <section class="answer-list">

      ${state.choices.map(
        color => {

          const isCorrect =
            color.id ===
            state.question.id;


          return `

            <div
              class="
                answer-item
                ${
                  isCorrect
                    ? "is-correct"
                    : ""
                }
              ">

              <div
                class="answer-dot"
                style="
                  background:${color.hex};
                ">
              </div>


              <div class="answer-text">

                <div class="answer-name">

                  ${color.name}

                </div>

                <div class="answer-reading">

                  ${color.reading}

                </div>

              </div>


              ${
                isCorrect
                  ? `

                    <div
                      class="answer-mark">

                      正解

                    </div>

                  `
                  : ""
              }

            </div>

          `;

        }
      ).join("")}

    </section>

  `;

}


/* =====================================================
   回答
   ===================================================== */

function answer(id) {

  if (
    state.answered
  ) {

    return;

  }


  const selected =
    colorById(id);


  if (!selected) {
    return;
  }


  state.selectedId =
    id;


  state.answered =
    true;


  state.correct =
    selected.id ===
    state.question.id;


  if (
    state.correct
  ) {

    state.correctAnswers++;


    /*
      知色には
      色そのもののIDを保存する。
    */

    state.discovered.add(
      state.question.id
    );


    saveProgress();

  }


  renderQuiz();

}


/* =====================================================
   次の問題
   ===================================================== */

function nextQuestion() {

  if (
    state.mode ===
    "shikibetsu"
  ) {

    createShikibetsuQuestion();

  } else {

    createKanshikiQuestion();

  }


  state.answered =
    false;

  state.correct =
    false;

  state.selectedId =
    null;


  renderQuiz();

}
/* =====================================================
   ランク一覧
   ===================================================== */

function openRanks() {

  state.screen = "ranks";

  renderRanks();

}


function renderRanks() {

  const current =
    currentRank();


  document.getElementById("app")
    .innerHTML = `

      <main class="app">

        <button
          class="back-button"
          onclick="goHome()">

          ← 戻る

        </button>


        <div class="screen-header">

          <h2>
            称号
          </h2>

          <p>
            しょうごう
          </p>

        </div>


        <section class="rank-list">

          ${RANKS.map(
            rank => {

              const reached =
                state.discovered.size >=

              /*

              return `

                <div

/* =====================================================
   背景設定
   ===================================================== */

function openBackground() {

  state.screen = "background";

  renderBackground();

}


function selectBackgroundStyle(style) {

  state.backgroundStyle = style;

  if (style === "default") {

    state.backgroundColor1 = null;
    state.backgroundColor2 = null;

  }

  saveBackground();
  applyBackground();
  renderBackground();

}


function selectBackgroundColor(id) {

  if (
    !state.discovered.has(id)
  ) {

    return;

  }


  if (
    state.backgroundStyle === "solid" ||
    state.backgroundStyle === "gradient-white"
  ) {

    state.backgroundColor1 = id;

  }


  else if (
    state.backgroundStyle === "gradient-two"
  ) {

    if (
      state.backgroundColor1 === id
    ) {

      state.backgroundColor1 = null;

    }

    else if (
      state.backgroundColor2 === id
    ) {

      state.backgroundColor2 = null;

    }

    else if (
      !state.backgroundColor1
    ) {

      state.backgroundColor1 = id;

    }

    else if (
      !state.backgroundColor2
    ) {

      state.backgroundColor2 = id;

    }

    else {

      // 2色選択済みなら、
      // 1色目を入れ替える
      state.backgroundColor1 = id;

    }

  }


  saveBackground();
  applyBackground();
  renderBackground();

}


function renderBackground() {

  const selectedStyle =
    state.backgroundStyle;


  const color1 =
    colorById(state.backgroundColor1);

  const color2 =
    colorById(state.backgroundColor2);


  let instruction = "";

  if (
    selectedStyle === "solid"
  ) {

    instruction =
      "色を1色選択してください";

  }

  else if (
    selectedStyle === "gradient-white"
  ) {

    instruction =
      "色を1色選択してください";

  }

  else if (
    selectedStyle === "gradient-two"
  ) {

    instruction =
      "色を2色選択してください";

  }

  else {

    instruction =
      "初期設定の背景です";

  }


  const discoveredColors =
    COLORS.filter(
      color =>
        state.discovered.has(color.id)
    );


  document.getElementById("app")
    .innerHTML = `

      <main class="app background-screen">

        <button
          class="back-button"
          onclick="goHome()">

          ← 戻る

        </button>


        <div class="screen-header">

          <h2>
            背景
          </h2>

          <p>
            はいけい
          </p>

        </div>


        <!-- プレビュー -->

        <section class="background-preview">

          <div
            class="background-preview-inner"
            style="
              background:
                ${getBackgroundStyle()};
            ">

            <div class="background-preview-title">
              四季彩
            </div>

            <div class="background-preview-subtitle">
              色を知り、色を感じる。
            </div>

          </div>

        </section>


        <!-- スタイル -->

        <section class="background-styles">

          <button
            class="
              background-style-button
              ${
                selectedStyle === "default"
                  ? "selected"
                  : ""
              }
            "
            onclick="
              selectBackgroundStyle('default')
            ">

            初期設定

          </button>


          <button
            class="
              background-style-button
              ${
                selectedStyle === "solid"
                  ? "selected"
                  : ""
              }
            "
            onclick="
              selectBackgroundStyle('solid')
            ">

            ベタ塗り

          </button>


          <button
            class="
              background-style-button
              ${
                selectedStyle === "gradient-white"
                  ? "selected"
                  : ""
              }
            "
            onclick="
              selectBackgroundStyle('gradient-white')
            ">

            白＋色

          </button>


          <button
            class="
              background-style-button
              ${
                selectedStyle === "gradient-two"
                  ? "selected"
                  : ""
              }
            "
            onclick="
              selectBackgroundStyle('gradient-two')
            ">

            2色

          </button>

        </section>


        <div class="background-instruction">

          ${instruction}

        </div>


        ${
          selectedStyle !== "default"
            ? `

              <div class="background-selected">

                ${
                  color1
                    ? `
                      <span>
                        ① ${color1.name}
                      </span>
                    `
                    : `
                      <span>
                        ① 未選択
                      </span>
                    `
                }


                ${
                  selectedStyle === "gradient-two"
                    ? (
                      color2
                        ? `
                          <span>
                            ② ${color2.name}
                          </span>
                        `
                        : `
                          <span>
                            ② 未選択
                          </span>
                        `
                    )
                    : ""
                }

              </div>

            `
            : ""
        }


        <!-- 色一覧だけスクロール -->

        <section class="background-colors">

          ${
            discoveredColors.length > 0
              ? discoveredColors.map(
                  color => {

                    const isFirst =
                      color.id ===
                      state.backgroundColor1;

                    const isSecond =
                      color.id ===
                      state.backgroundColor2;

                    const selected =
                      isFirst ||
                      isSecond;


                    return `

                      <button
                        class="
                          background-color
                          ${
                            selected
                              ? "selected"
                              : ""
                          }
                          ${
                            isFirst
                              ? "first"
                              : ""
                          }
                          ${
                            isSecond
                              ? "second"
                              : ""
                          }
                        "
                        onclick="
                          selectBackgroundColor(
                            '${color.id}'
                          )
                        "
                        title="
                          ${color.name}
                        "
                        style="
                          background:
                            ${color.hex};
                        ">

                        ${
                          isFirst
                            ? `<span>1</span>`
                            : ""
                        }

                        ${
                          isSecond
                            ? `<span>2</span>`
                            : ""
                        }

                      </button>

                    `;

                  }
                ).join("")
              : `

                <div class="background-empty">

                  まず知色で色を発見してください。

                </div>

              `
          }

        </section>

      </main>

    `;

}

/* =====================================================
   四季彩を友達に紹介
   ===================================================== */

async function shareApp() {

  const shareData = {
    title: "四季彩",
    text: "色の名前、色の違いを知るゲーム。\n山吹色はどんな色か知っていますか？",
    url: window.location.href
  };


  if (
    navigator.share
  ) {

    try {

      await navigator.share(
        shareData
      );

    } catch (error) {

      // ユーザーが共有画面を閉じた場合は何もしない

    }

    return;

  }


  // Web Share API 非対応の場合
  try {

    await navigator.clipboard.writeText(
      window.location.href
    );

    alert(
      "四季彩のURLをコピーしました。"
    );

  } catch (error) {

    alert(
      "このページのURLをコピーして、友達に紹介してください。"
    );

  }

}
